name: Build Android APK Locally

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Version 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI globally
        run: npm install -g eas-cli

      - name: Build APK locally (Bypass Expo login)
        env:
          EXPO_NO_AUTH_WARN: 1
          EAS_NO_VCS: 1
        run: |
          # تجاوز الحاجة لتسجيل الدخول عبر تمرير متغير بيئي وهمي للبناء المحلي
          export EXPO_TOKEN="bypass_token_for_local_build"
          npx eas-cli build --platform android --profile preview --non-interactive --local
